<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Panda ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff7eb3, #ffb07c);
            font-family: Arial, sans-serif;
        }

            .photo {
    width: 90%;
    max-width: 500px;
    border-radius: 25px;

    /* Soft blend effect */
    mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
    );

    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
    );

    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

    </style>
</head>

<body>
    
    <img src="Images/panda-birthday.jpg" class="photo">

</body>
</html>
