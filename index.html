<!DOCTYPE html>
<html lang="eng">

<head>
      
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

             <title>Birthday Surprise ❤️</title>

  <link rel="stylesheet"
  href="style.css">
       </head> 

         <body>
            <div id="balloons"
            style="display:none;"></div>
       
     <div class="verification-screen">
      

    <h1>🎂 Before Opening Your Surprise</h1>

    <p>Let's verify that this surprise is really for you ❤️</p>

    <div class="verify-box">

        <label>Day</label>
        <input type="number" id="day" placeholder="15" min="1" max="31">

        <label>Month</label>
        <select id="month">
            <option value="">Select Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>

        <button id="verifyBtn">
            ❤️ Verify Birthday
        </button>

    </div>
    </div> 
<div class="welcome-screen" style="display:none;">

    <h1>🎉 Happy Birthday 🥳</h1>

    <h2>Someone has made something special just for you ❤️</h2>

    <button id="startBtn">Open Surprise 🎁</button>
    

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

     <script src="script.js"></script>
  
   </body>

   </html>
